<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 전술 시뮬레이터 (직접 조작)</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #e74c3c; }
        p { margin-top: 0; margin-bottom: 20px; color: #bdc3c7; }
        .scoreboard {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #f1c40f;
        }
        canvas {
            background-color: #27ae60;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .controls-info { margin-top: 15px; text-align: center; color: #ecf0f1; }
        .key {
            background: #34495e;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin: 0 3px;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <h1>전술 시뮬레이션: 역습과 슈팅</h1>
    <p>주장(노란색 테두리)을 컨트롤하여 수비를 뚫고 득점하세요!</p>
    
    <div class="scoreboard">SCORE: <span id="scoreVal">0</span></div>

    <canvas id="pitch" width="800" height="500"></canvas>
    
    <div class="controls-info">
        이동: <span class="key">방향키</span> (또는 W, A, S, D) &nbsp;&nbsp;|&nbsp;&nbsp; 
        슈팅: <span class="key">Spacebar</span>
    </div>
    
    <button onclick="resetGame()">경기 초기화</button>

    <script>
        const canvas = document.getElementById('pitch');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreVal');

        let score = 0;
        let ball = { x: 400, y: 250, targetX: 400, targetY: 250, speed: 8, owner: null, isShooting: false };
        let players = [];
        
        // 키보드 입력 상태 저장
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // 선수 초기 세팅
        function initPlayers() {
            players = [];
            // 플레이어 캐릭터 (주장, 인덱스 0)
            players.push({
                x: 350, y: 250,
                color: '#e74c3c',
                speed: 4.5,
                team: 'KOR',
                isPlayer: true
            });

            // 대한민국 AI 동료
            for (let i = 0; i < 4; i++) {
                players.push({
                    x: 200 + Math.random() * 50,
                    y: 100 + i * 90,
                    color: '#e74c3c',
                    speed: 3.5,
                    team: 'KOR',
                    isPlayer: false
                });
            }
            // 상대팀 수비수
            for (let i = 0; i < 5; i++) {
                players.push({
                    x: 600 - Math.random() * 100,
                    y: 100 + i * 80,
                    color: '#2980b9',
                    speed: 2.5,
                    team: 'OPP',
                    isPlayer: false
                });
            }
        }

        function resetGame(fullReset = true) {
            ball.x = 400; ball.y = 250;
            ball.targetX = 400; ball.targetY = 250;
            ball.owner = null;
            ball.isShooting = false;
            ball.speed = 8;
            if (fullReset) score = 0;
            scoreElement.innerText = score;
            initPlayers();
        }

        function drawPitch() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;

            // 하프라인 & 센터 서클
            ctx.beginPath();
            ctx.moveTo(400, 0); ctx.lineTo(400, 500);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(400, 250, 70, 0, Math.PI * 2);
            ctx.stroke();

            // 페널티 박스
            ctx.strokeRect(0, 100, 150, 300);
            ctx.strokeRect(650, 100, 150, 300);

            // 골대 그리기
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fillRect(0, 200, 20, 100); // 좌측 골대
            ctx.fillRect(780, 200, 20, 100); // 우측 골대 (상대팀)
        }

        function update() {
            let user = players[0];

            // 1. 유저 이동 (방향키)
            if (keys['ArrowUp'] || keys['KeyW']) user.y -= user.speed;
            if (keys['ArrowDown'] || keys['KeyS']) user.y += user.speed;
            if (keys['ArrowLeft'] || keys['KeyA']) user.x -= user.speed;
            if (keys['ArrowRight'] || keys['KeyD']) user.x += user.speed;

            // 유저 경기장 이탈 방지
            user.x = Math.max(15, Math.min(canvas.width - 15, user.x));
            user.y = Math.max(15, Math.min(canvas.height - 15, user.y));

            // 2. 공과 유저의 충돌(소유권 획득)
            let distToBall = Math.hypot(ball.x - user.x, ball.y - user.y);
            if (distToBall < 22 && !ball.isShooting) {
                ball.owner = user;
            }

            // 3. 공 상태 업데이트
            if (ball.owner === user) {
                // 드리블 중
                ball.x = user.x + 12; 
                ball.y = user.y;
                
                // 슈팅 (스페이스바)
                if (keys['Space']) {
                    ball.owner = null;
                    ball.isShooting = true;
                    ball.targetX = 800; // 상대 골대 방향
                    ball.targetY = 250; // 골대 중앙
                    ball.speed = 18;    // 슛 속도 증가
                }
            } else {
                // 패스나 슛으로 굴러가는 중
                let dx = ball.targetX - ball.x;
                let dy = ball.targetY - ball.y;
                let dist = Math.hypot(dx, dy);
                if (dist > ball.speed) {
                    ball.x += (dx / dist) * ball.speed;
                    ball.y += (dy / dist) * ball.speed;
                } else {
                    // 목표 도착 시 멈춤
                    ball.x = ball.targetX;
                    ball.y = ball.targetY;
                    ball.isShooting = false;
                    ball.speed = 8; 
                }
            }

            // 4. 골인 판정 (우측 골대 x > 780, y 200~300 사이)
            if (ball.x > 780 && ball.y > 190 && ball.y < 310) {
                score++;
                alert('GOAL! 멋진 득점입니다!');
                resetGame(false); // 점수는 유지하고 위치만 초기화
                return; // 이번 프레임 업데이트 종료
            }

            // 5. AI 동료 및 상대팀 이동 로직
            players.forEach(p => {
                if (p.isPlayer) return; // 유저는 스킵

                let targetX = ball.x;
                let targetY = ball.y;

                // 유저가 공을 가졌을 때 AI의 움직임
                if (ball.owner === user) {
                    if (p.team === 'KOR') {
                        // 한국 동료는 공격 진영으로 전진 (단순화)
                        targetX = p.x + 2; 
                        targetY = p.y;
                    }
                }

                let pdx = targetX - p.x;
                let pdy = targetY - p.y;
                let pDist = Math.hypot(pdx, pdy);
                
                // 너무 겹치지 않게 거리 유지하며 추격
                if (pDist > 15) {
                    p.x += (pdx / pDist) * p.speed;
                    p.y += (pdy / pDist) * p.speed;
                }
            });
        }

        function draw() {
            drawPitch();

            // 선수 그리기
            players.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                
                // 유저 캐릭터는 노란색 테두리로 강조
                if (p.isPlayer) {
                    ctx.strokeStyle = '#f1c40f';
                    ctx.lineWidth = 4;
                } else {
                    ctx.strokeStyle = '#222';
                    ctx.lineWidth = 2;
                }
                ctx.stroke();
            });

            // 공 그리기
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // 초기 실행
        initPlayers();
        loop();
    </script>
</body>
</html>
