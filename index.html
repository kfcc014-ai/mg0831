<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 전술 시뮬레이터</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #e74c3c; }
        p { margin-top: 0; margin-bottom: 20px; color: #bdc3c7; }
        canvas {
            background-color: #27ae60;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: crosshair;
        }
        .controls { margin-top: 15px; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <h1>전술 시뮬레이션: 전방 압박</h1>
    <p>경기장을 클릭하여 공을 움직여보세요. 붉은색(대한민국)이 공을 향해 압박합니다.</p>

    <canvas id="pitch" width="800" height="500"></canvas>
    
    <div class="controls">
        <button onclick="resetGame()">위치 초기화</button>
    </div>

    <script>
        const canvas = document.getElementById('pitch');
        const ctx = canvas.getContext('2d');

        let ball = { x: 400, y: 250, targetX: 400, targetY: 250, speed: 8 };
        let players = [];

        // 선수 초기 세팅
        function initPlayers() {
            players = [];
            // 대한민국 (빨간색 - 스피드 빠름)
            for (let i = 0; i < 5; i++) {
                players.push({
                    x: 200 + Math.random() * 100,
                    y: 100 + i * 80,
                    color: '#e74c3c',
                    speed: 3 + Math.random() * 1.5,
                    team: 'KOR'
                });
            }
            // 상대팀 (파란색 - 스피드 보통)
            for (let i = 0; i < 5; i++) {
                players.push({
                    x: 600 - Math.random() * 100,
                    y: 100 + i * 80,
                    color: '#2980b9',
                    speed: 2 + Math.random() * 1,
                    team: 'OPP'
                });
            }
        }

        function resetGame() {
            ball.x = 400; ball.y = 250;
            ball.targetX = 400; ball.targetY = 250;
            initPlayers();
        }

        // 경기장 그리기
        function drawPitch() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;

            // 하프라인
            ctx.beginPath();
            ctx.moveTo(400, 0);
            ctx.lineTo(400, 500);
            ctx.stroke();

            // 센터 서클
            ctx.beginPath();
            ctx.arc(400, 250, 70, 0, Math.PI * 2);
            ctx.stroke();

            // 페널티 박스 (좌)
            ctx.strokeRect(0, 100, 150, 300);
            // 페널티 박스 (우)
            ctx.strokeRect(650, 100, 150, 300);
        }

        function update() {
            // 공 이동
            let dx = ball.targetX - ball.x;
            let dy = ball.targetY - ball.y;
            let dist = Math.hypot(dx, dy);
            if (dist > ball.speed) {
                ball.x += (dx / dist) * ball.speed;
                ball.y += (dy / dist) * ball.speed;
            } else {
                ball.x = ball.targetX;
                ball.y = ball.targetY;
            }

            // 선수 이동 (공을 향해 추격)
            players.forEach(p => {
                let pdx = ball.x - p.x;
                let pdy = ball.y - p.y;
                let pDist = Math.hypot(pdx, pdy);
                
                // 공과 일정 거리 유지 (너무 겹치지 않게)
                if (pDist > 15) {
                    p.x += (pdx / pDist) * p.speed;
                    p.y += (pdy / pDist) * p.speed;
                }
            });
        }

        function draw() {
            drawPitch();

            // 선수 그리기
            players.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // 공 그리기
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // 마우스 클릭 이벤트 (공 이동 위치 지정)
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            ball.targetX = e.clientX - rect.left;
            ball.targetY = e.clientY - rect.top;
        });

        initPlayers();
        loop();
    </script>
</body>
</html>
