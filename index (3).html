<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG 맞춤형 대출 상환 계산기</title>
    
    <!-- 폰트: Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config for MG Brand Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'mg-blue': '#005b9f',
                        'mg-blue-dark': '#00477e',
                        'mg-green': '#00a651',
                        'mg-bg': '#f3f6f8',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* 커스텀 스크롤바 및 input 스타일 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* 라디오 버튼 커스텀 (상환 방식) */
        .method-radio:checked + label {
            background-color: #005b9f;
            color: white;
            border-color: #005b9f;
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-mg-bg text-slate-800 antialiased min-h-screen">

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        
        <!-- Header -->
        <header class="flex items-center gap-3 mb-8 pb-4 border-b border-gray-200">
            <div class="w-10 h-10 bg-mg-blue rounded-full flex items-center justify-center shadow-md">
                <i data-lucide="landmark" class="text-white w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">MG 맞춤형 대출 계산기</h1>
                <p class="text-sm text-slate-500 mt-1">고객님의 상황에 맞는 최적의 상환 스케줄을 확인해보세요.</p>
            </div>
        </header>

        <div class="grid lg:grid-cols-12 gap-8">
            
            <!-- Left: Input Section -->
            <div class="lg:col-span-5 space-y-6">
                <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                    <form id="calculatorForm" class="space-y-7" onsubmit="event.preventDefault(); calculateLoan();">
                        
                        <!-- 1. 대출 금액 -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">대출 금액</label>
                            <div class="relative">
                                <input type="text" id="amount" 
                                    class="w-full text-right text-lg font-bold p-3 pr-12 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-mg-blue focus:border-transparent transition-shadow" 
                                    placeholder="0" value="10000" oninput="formatAmountInput(this)">
                                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 font-medium">만원</span>
                            </div>
                            <div class="flex gap-2 mt-3">
                                <button type="button" onclick="addAmount(100)" class="flex-1 py-2 text-sm bg-gray-50 border border-gray-200 rounded-md text-slate-600 hover:bg-mg-blue hover:text-white hover:border-mg-blue transition-colors">+100만</button>
                                <button type="button" onclick="addAmount(500)" class="flex-1 py-2 text-sm bg-gray-50 border border-gray-200 rounded-md text-slate-600 hover:bg-mg-blue hover:text-white hover:border-mg-blue transition-colors">+500만</button>
                                <button type="button" onclick="addAmount(1000)" class="flex-1 py-2 text-sm bg-gray-50 border border-gray-200 rounded-md text-slate-600 hover:bg-mg-blue hover:text-white hover:border-mg-blue transition-colors">+1000만</button>
                                <button type="button" onclick="clearAmount()" class="px-4 py-2 text-sm bg-gray-100 border border-gray-200 rounded-md text-slate-500 hover:bg-gray-200 transition-colors">
                                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 2. 대출 기간 -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">대출 기간</label>
                            <div class="flex gap-2">
                                <input type="number" id="term" min="1" max="600" value="12"
                                    class="w-full text-right text-lg font-bold p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-mg-blue focus:border-transparent transition-shadow">
                                <select id="termType" class="w-32 p-3 bg-gray-50 border border-gray-300 rounded-lg font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-mg-blue">
                                    <option value="month">개월</option>
                                    <option value="year">년</option>
                                </select>
                            </div>
                        </div>

                        <!-- 3. 연 이자율 -->
                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="block text-sm font-bold text-slate-700">연 이자율</label>
                                <span class="text-mg-blue font-bold" id="rateDisplay">5.0%</span>
                            </div>
                            <div class="relative mb-3">
                                <input type="number" id="rate" step="0.1" min="0" max="24" value="5.0"
                                    class="w-full text-right text-lg font-bold p-3 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-mg-blue focus:border-transparent transition-shadow"
                                    oninput="syncSlider(this.value)">
                                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 font-medium">%</span>
                            </div>
                            <input type="range" id="rateSlider" min="0" max="20" step="0.1" value="5.0" 
                                class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-mg-blue"
                                oninput="syncInput(this.value)">
                        </div>

                        <!-- 4. 상환 방식 -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">상환 방식</label>
                            <div class="grid grid-cols-1 gap-2">
                                <div class="relative">
                                    <input type="radio" name="method" id="method1" value="equal_pmt" class="hidden method-radio" checked>
                                    <label for="method1" class="block w-full p-3 text-center border border-gray-300 rounded-lg cursor-pointer text-slate-600 transition-colors">
                                        원리금균등분할상환
                                    </label>
                                </div>
                                <div class="relative">
                                    <input type="radio" name="method" id="method2" value="equal_prin" class="hidden method-radio">
                                    <label for="method2" class="block w-full p-3 text-center border border-gray-300 rounded-lg cursor-pointer text-slate-600 transition-colors">
                                        원금균등분할상환
                                    </label>
                                </div>
                                <div class="relative">
                                    <input type="radio" name="method" id="method3" value="bullet" class="hidden method-radio">
                                    <label for="method3" class="block w-full p-3 text-center border border-gray-300 rounded-lg cursor-pointer text-slate-600 transition-colors">
                                        만기일시상환
                                    </label>
                                </div>
                            </div>
                            <p class="text-xs text-gray-500 mt-2 ml-1" id="methodDesc">매월 동일한 원금과 이자를 합산하여 상환합니다.</p>
                        </div>

                        <!-- 계산 버튼 -->
                        <button type="submit" class="w-full py-4 bg-mg-blue hover:bg-mg-blue-dark text-white text-lg font-bold rounded-xl shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                            <i data-lucide="calculator" class="w-5 h-5"></i>
                            계산하기
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right: Results Section -->
            <div class="lg:col-span-7 flex flex-col h-full">
                
                <!-- Initial Empty State -->
                <div id="emptyState" class="bg-white rounded-2xl shadow-sm border border-gray-100 flex-1 flex flex-col items-center justify-center p-12 text-center min-h-[400px]">
                    <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mb-4">
                        <i data-lucide="wallet" class="w-10 h-10 text-mg-blue opacity-50"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-700 mb-2">대출 조건을 입력해주세요</h3>
                    <p class="text-slate-500">좌측에서 대출금액, 기간, 금리를 입력하고<br>'계산하기'를 누르시면 상환 일정이 표시됩니다.</p>
                </div>

                <!-- Results Container (Hidden initially) -->
                <div id="resultState" class="hidden space-y-6 flex-1">
                    
                    <!-- 요약 카드 -->
                    <div class="grid sm:grid-cols-2 gap-4">
                        <div class="bg-mg-blue text-white p-6 rounded-2xl shadow-sm relative overflow-hidden">
                            <div class="absolute -right-4 -bottom-4 opacity-10">
                                <i data-lucide="coins" class="w-32 h-32"></i>
                            </div>
                            <p class="text-blue-100 text-sm font-medium mb-1">1회차 월 상환액</p>
                            <h3 class="text-2xl font-bold tracking-tight" id="resFirstPmt">0원</h3>
                        </div>
                        
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center">
                            <div class="flex justify-between items-end mb-2">
                                <p class="text-slate-500 text-sm font-medium">총 이자 합계</p>
                                <span class="text-xs bg-mg-green text-white px-2 py-1 rounded font-bold" id="resMethodTag">원리금균등</span>
                            </div>
                            <h3 class="text-2xl font-bold text-slate-800 tracking-tight" id="resTotalInterest">0원</h3>
                            <p class="text-sm text-slate-400 mt-1" id="resTotalPmtStr">원금 + 이자 = 0원</p>
                        </div>
                    </div>

                    <!-- 회차별 상세 테이블 -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex-1 flex flex-col overflow-hidden max-h-[600px]">
                        <div class="p-5 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                            <h3 class="font-bold text-slate-800">월별 상환 스케줄</h3>
                            <span class="text-xs text-slate-500">* 실제 금융기관의 계산과 약간의 단수 차이가 발생할 수 있습니다.</span>
                        </div>
                        
                        <div class="overflow-x-auto overflow-y-auto custom-scrollbar flex-1 bg-white">
                            <table class="w-full text-right text-sm whitespace-nowrap">
                                <thead class="bg-white sticky top-0 border-b border-gray-200 z-10 text-slate-500">
                                    <tr>
                                        <th class="py-3 px-4 text-center font-medium w-16">회차</th>
                                        <th class="py-3 px-4 font-medium">납입 원금</th>
                                        <th class="py-3 px-4 font-medium">대출 이자</th>
                                        <th class="py-3 px-4 font-bold text-mg-blue">월 상환금</th>
                                        <th class="py-3 px-4 font-medium">대출 잔액</th>
                                    </tr>
                                </thead>
                                <tbody id="scheduleBody" class="divide-y divide-gray-100 text-slate-700">
                                    <!-- JS rows will be injected here -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // 설명 문구 업데이트 이벤트
        const methodDescMap = {
            'equal_pmt': '매월 동일한 원금과 이자를 합산하여 상환합니다.',
            'equal_prin': '매월 동일한 원금을 상환하고 이자는 점차 줄어듭니다.',
            'bullet': '매월 이자만 납부하고, 만기 시 원금을 일시 상환합니다.'
        };
        const methodNameMap = {
            'equal_pmt': '원리금균등',
            'equal_prin': '원금균등',
            'bullet': '만기일시'
        };

        document.querySelectorAll('.method-radio').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.getElementById('methodDesc').innerText = methodDescMap[e.target.value];
            });
        });

        // 원단위 콤마 포맷터 (숫자만 추출 후 적용)
        function formatAmountInput(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if(value) {
                input.value = Number(value).toLocaleString('ko-KR');
            } else {
                input.value = '';
            }
        }

        // 금액 퀵 버튼 (+100, +500, +1000 단위: 만원)
        function addAmount(addValue) {
            const input = document.getElementById('amount');
            let current = parseInt(input.value.replace(/,/g, '')) || 0;
            current += addValue;
            input.value = current.toLocaleString('ko-KR');
        }

        function clearAmount() {
            document.getElementById('amount').value = '';
        }

        // 금리 슬라이더-인풋 동기화
        function syncSlider(val) {
            document.getElementById('rateSlider').value = val;
            document.getElementById('rateDisplay').innerText = val ? val + '%' : '0%';
        }
        function syncInput(val) {
            document.getElementById('rate').value = val;
            document.getElementById('rateDisplay').innerText = val + '%';
        }

        // 숫자 -> 화폐 문자열 변환
        const formatKRW = (num) => Math.round(num).toLocaleString('ko-KR') + '원';

        // 대출 계산 로직 코어
        function calculateLoan() {
            const amountInput = document.getElementById('amount').value.replace(/,/g, '');
            const termInput = document.getElementById('term').value;
            const rateInput = document.getElementById('rate').value;

            if(!amountInput || !termInput || !rateInput) {
                alert("대출 금액, 기간, 이자율을 모두 입력해주세요.");
                return;
            }

            const principal = parseInt(amountInput) * 10000; // 만원 단위 -> 원 단위
            if(principal <= 0) return;

            const isYear = document.getElementById('termType').value === 'year';
            const totalMonths = isYear ? parseInt(termInput) * 12 : parseInt(termInput);
            
            const annualRate = parseFloat(rateInput);
            const monthlyRate = (annualRate / 100) / 12;
            const method = document.querySelector('input[name="method"]:checked').value;

            let schedule = [];
            let totalInterest = 0;
            let balance = principal;
            let firstPmt = 0;

            if (monthlyRate === 0) { // 금리가 0% 일 경우 예외 처리
                const monthlyPrincipal = method === 'bullet' ? 0 : Math.round(principal / totalMonths);
                for(let i=1; i<=totalMonths; i++) {
                    let curPrin = monthlyPrincipal;
                    if (method === 'bullet' && i === totalMonths) curPrin = principal;
                    if (method !== 'bullet' && i === totalMonths) curPrin = balance; // 마지막 달 단수 조정
                    
                    balance -= curPrin;
                    let pmt = curPrin;
                    if(i===1) firstPmt = pmt;
                    schedule.push({ idx: i, prin: curPrin, int: 0, pmt: pmt, bal: Math.max(0, balance) });
                }
            } else {
                if (method === 'equal_pmt') { // 원리금균등분할상환
                    // 월상환금 = 원금 * r * (1+r)^n / ((1+r)^n - 1)
                    const pmt = Math.round(principal * monthlyRate * Math.pow(1 + monthlyRate, totalMonths) / (Math.pow(1 + monthlyRate, totalMonths) - 1));
                    
                    for(let i=1; i<=totalMonths; i++) {
                        const interest = Math.round(balance * monthlyRate);
                        let prin = pmt - interest;
                        
                        if (i === totalMonths) { // 마지막 회차 원금/이자 보정
                            prin = balance;
                        }
                        
                        const currentPmt = prin + interest;
                        balance -= prin;
                        totalInterest += interest;
                        
                        if(i===1) firstPmt = currentPmt;
                        schedule.push({ idx: i, prin: prin, int: interest, pmt: currentPmt, bal: Math.max(0, balance) });
                    }
                } 
                else if (method === 'equal_prin') { // 원금균등분할상환
                    const monthlyPrin = Math.round(principal / totalMonths);
                    
                    for(let i=1; i<=totalMonths; i++) {
                        const interest = Math.round(balance * monthlyRate);
                        let curPrin = monthlyPrin;
                        
                        if (i === totalMonths) { // 마지막 회차 단수 조정
                            curPrin = balance;
                        }
                        
                        const currentPmt = curPrin + interest;
                        balance -= curPrin;
                        totalInterest += interest;

                        if(i===1) firstPmt = currentPmt;
                        schedule.push({ idx: i, prin: curPrin, int: interest, pmt: currentPmt, bal: Math.max(0, balance) });
                    }
                } 
                else if (method === 'bullet') { // 만기일시상환
                    for(let i=1; i<=totalMonths; i++) {
                        const interest = Math.round(principal * monthlyRate);
                        const curPrin = (i === totalMonths) ? principal : 0;
                        const currentPmt = curPrin + interest;
                        
                        balance -= curPrin;
                        totalInterest += interest;

                        if(i===1) firstPmt = currentPmt;
                        schedule.push({ idx: i, prin: curPrin, int: interest, pmt: currentPmt, bal: Math.max(0, balance) });
                    }
                }
            }

            renderResults(firstPmt, totalInterest, principal, schedule, method);
        }

        function renderResults(firstPmt, totalInterest, principal, schedule, method) {
            // UI Switch
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('resultState').classList.remove('hidden');
            document.getElementById('resultState').classList.add('flex', 'flex-col'); // flex 복구

            // Update Summaries
            document.getElementById('resFirstPmt').innerText = formatKRW(firstPmt);
            document.getElementById('resTotalInterest').innerText = formatKRW(totalInterest);
            document.getElementById('resTotalPmtStr').innerText = `총 상환금: ${formatKRW(principal + totalInterest)}`;
            document.getElementById('resMethodTag').innerText = methodNameMap[method];

            // Update Table
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';

            let rowsHTML = '';
            schedule.forEach(row => {
                rowsHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="py-3 px-4 text-center border-r border-gray-50 text-slate-500 font-medium">${row.idx}</td>
                        <td class="py-3 px-4">${formatKRW(row.prin)}</td>
                        <td class="py-3 px-4 text-slate-500">${formatKRW(row.int)}</td>
                        <td class="py-3 px-4 font-bold text-mg-blue">${formatKRW(row.pmt)}</td>
                        <td class="py-3 px-4 text-slate-600">${formatKRW(row.bal)}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = rowsHTML;
        }

        // Initialize formatting on load
        window.onload = () => {
            formatAmountInput(document.getElementById('amount'));
        }
    </script>
</body>
</html>
