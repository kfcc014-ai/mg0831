<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 전술 시뮬레이터 : 캡틴 한성준</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Pretendard', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 15px; }
        h1 { margin: 0 0 10px 0; color: #ef3340; text-shadow: 2px 2px 0px #000; }
        
        .hud {
            display: flex;
            justify-content: space-between;
            width: 800px;
            background: #0f3460;
            padding: 10px 20px;
            box-sizing: border-box;
            border-radius: 8px 8px 0 0;
            font-size: 20px;
            font-weight: 900;
            border: 4px solid #fff;
            border-bottom: none;
        }
        .time { color: #f1c40f; }
        .score { color: #fff; }

        canvas {
            background-color: #27ae60;
            border: 4px solid #fff;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 15px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
        }
        .key { color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>KOREA FOOTBALL: CAPTAIN</h1>
    </div>
    
    <div class="hud">
        <div class="score">KOR <span id="scoreVal">0</span> : 0 OPP</div>
        <div class="time">TIME <span id="timeVal">00:00</span></div>
    </div>

    <canvas id="pitch" width="800" height="500"></canvas>
    
    <div class="controls">
        조작: <span class="key">방향키(↑↓←→)</span> 이동 | <span class="key">스페이스바(Space)</span> 슈팅 | 가까이 가면 자동 드리블
    </div>

    <script>
        const canvas = document.getElementById('pitch');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreVal');
        const timeElement = document.getElementById('timeVal');

        let score = 0;
        let gameTime = 0;
        let frameCount = 0;
        let ball = { x: 400, y: 250, targetX: 400, targetY: 250, speed: 8, owner: null, isShooting: false };
        let players = [];
        
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function initPlayers() {
            players = [];
            // 주장 한성준 (Player)
            players.push({
                x: 350, y: 250,
                team: 'KOR', isPlayer: true,
                number: 7, name: '한성준', speed: 4.5, isMoving: false
            });

            // 한국 팀 동료 (AI)
            const korNumbers = [9, 10, 11, 4];
            for (let i = 0; i < 4; i++) {
                players.push({
                    x: 150 + Math.random() * 100, y: 80 + i * 100,
                    team: 'KOR', isPlayer: false,
                    number: korNumbers[i], speed: 3.5, startY: 80 + i * 100, isMoving: false
                });
            }

            // 상대 팀 수비수 (AI)
            for (let i = 0; i < 4; i++) {
                players.push({
                    x: 600 - Math.random() * 50, y: 80 + i * 100,
                    team: 'OPP', isPlayer: false,
                    number: i + 2, speed: 2.5, role: 'DF', isMoving: false
                });
            }
            
            // 상대 팀 골키퍼
            players.push({
                x: 770, y: 250,
                team: 'OPP', isPlayer: false,
                number: 1, speed: 3.0, role: 'GK', isMoving: false
            });
        }

        function resetPositions() {
            ball.x = 400; ball.y = 250;
            ball.targetX = 400; ball.targetY = 250;
            ball.owner = null; ball.isShooting = false; ball.speed = 8;
            initPlayers();
        }

        function drawPitch() {
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.fillStyle = (i / 50) % 2 === 0 ? '#27ae60' : '#2ecc71';
                ctx.fillRect(i, 0, 50, canvas.height);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 3;

            ctx.strokeRect(10, 10, 780, 480);
            ctx.beginPath(); ctx.moveTo(400, 10); ctx.lineTo(400, 490); ctx.stroke();
            ctx.beginPath(); ctx.arc(400, 250, 70, 0, Math.PI * 2); ctx.stroke();

            ctx.strokeRect(10, 100, 130, 300);
            ctx.strokeRect(660, 100, 130, 300);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(0, 200, 15, 100);
            ctx.fillRect(785, 200, 15, 100);
        }

        // 캐릭터 그리기 함수 (원 대신 사람 형태)
        function drawPlayer(p) {
            ctx.save();
            ctx.translate(p.x, p.y);

            // 달릴 때 팔다리를 앞뒤로 흔드는 애니메이션 계산
            let swing = p.isMoving ? Math.sin(frameCount * 0.4) * 6 : 0;

            // 팀별 색상 설정
            let shirtColor = p.team === 'KOR' ? '#ef3340' : '#003478';
            if (p.role === 'GK') shirtColor = '#f39c12';
            let skinColor = '#f1c27d';
            let shortsColor = p.team === 'KOR' ? '#222' : '#fff';
            let shoesColor = '#333';

            // 1. 그림자
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(0, 14, 12, 5, 0, 0, Math.PI*2); ctx.fill();

            // 2. 다리 (이동 시 흔들림)
            // 왼쪽 다리
            ctx.fillStyle = shortsColor; ctx.fillRect(-7, 2 + swing, 6, 7); // 바지
            ctx.fillStyle = skinColor;   ctx.fillRect(-6, 9 + swing, 4, 4); // 맨살
            ctx.fillStyle = shoesColor;  ctx.fillRect(-7, 13 + swing, 6, 4); // 신발
            // 오른쪽 다리
            ctx.fillStyle = shortsColor; ctx.fillRect(1, 2 - swing, 6, 7);
            ctx.fillStyle = skinColor;   ctx.fillRect(2, 9 - swing, 4, 4);
            ctx.fillStyle = shoesColor;  ctx.fillRect(1, 13 - swing, 6, 4);

            // 3. 팔 (다리와 반대로 흔들림)
            // 왼쪽 팔
            ctx.fillStyle = shirtColor; ctx.fillRect(-12, -6 - swing, 5, 7); // 소매
            ctx.fillStyle = skinColor;  ctx.fillRect(-11, 1 - swing, 3, 5); // 손
            // 오른쪽 팔
            ctx.fillStyle = shirtColor; ctx.fillRect(7, -6 + swing, 5, 7);
            ctx.fillStyle = skinColor;  ctx.fillRect(8, 1 + swing, 3, 5);

            // 주장 완장 (왼팔)
            if (p.isPlayer) {
                ctx.fillStyle = '#f1c40f'; // 노란색 완장
                ctx.fillRect(-13, -4 - swing, 7, 3);
            }

            // 4. 몸통 (티셔츠)
            ctx.fillStyle = shirtColor;
            // 둥근 사각형 효과를 위해 arc와 rect 조합
            ctx.beginPath();
            ctx.arc(-4, -6, 4, Math.PI, Math.PI*1.5);
            ctx.arc(4, -6, 4, Math.PI*1.5, Math.PI*2);
            ctx.lineTo(8, 4); ctx.lineTo(-8, 4);
            ctx.fill();

            // 5. 머리와 머리카락
            ctx.fillStyle = skinColor;
            ctx.beginPath(); ctx.arc(0, -12, 6, 0, Math.PI*2); ctx.fill(); // 얼굴
            
            ctx.fillStyle = '#222'; // 검은 머리카락
            ctx.beginPath(); ctx.arc(0, -13, 6, Math.PI, 0); ctx.fill(); // 머리 위쪽

            // 6. 등번호
            ctx.fillStyle = p.team === 'KOR' ? '#fff' : '#fff';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p.number, 0, -1);

            // 7. 이름표 (주장만)
            if (p.isPlayer) {
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Pretendard';
                ctx.fillText(p.name, 0, -28);
            }

            ctx.restore();
        }

        function update() {
            let user = players[0];

            // 모든 선수의 이동 상태 초기화 (애니메이션 용도)
            players.forEach(p => {
                p.prevX = p.x;
                p.prevY = p.y;
            });

            // 1. 유저 조작
            if (keys['ArrowUp'] || keys['KeyW']) user.y -= user.speed;
            if (keys['ArrowDown'] || keys['KeyS']) user.y += user.speed;
            if (keys['ArrowLeft'] || keys['KeyA']) user.x -= user.speed;
            if (keys['ArrowRight'] || keys['KeyD']) user.x += user.speed;

            user.x = Math.max(15, Math.min(canvas.width - 15, user.x));
            user.y = Math.max(15, Math.min(canvas.height - 15, user.y));

            // 2. 공 소유 판정
            let distToBall = Math.hypot(ball.x - user.x, ball.y - user.y);
            if (distToBall < 25 && !ball.isShooting) ball.owner = user;

            // 3. 공 이동 및 슈팅
            if (ball.owner === user) {
                ball.x = user.x + 12; ball.y = user.y + 8; // 발 위치로 공 이동
                if (keys['Space']) {
                    ball.owner = null; ball.isShooting = true;
                    ball.targetX = 800; ball.targetY = 250; 
                    ball.speed = 18; 
                }
            } else {
                let dx = ball.targetX - ball.x;
                let dy = ball.targetY - ball.y;
                let dist = Math.hypot(dx, dy);
                if (dist > ball.speed) {
                    ball.x += (dx / dist) * ball.speed;
                    ball.y += (dy / dist) * ball.speed;
                } else {
                    ball.x = ball.targetX; ball.y = ball.targetY;
                    ball.isShooting = false; ball.speed = 8;
                }
            }

            // 4. 골인 판정
            if (ball.x > 780 && ball.y > 195 && ball.y < 305) {
                score++;
                scoreElement.innerText = score;
                resetPositions();
                return;
            }

            // 5. 활발한 AI 움직임 로직 적용
            players.forEach(p => {
                if (p.isPlayer) return;

                let targetX = ball.x;
                let targetY = ball.y;

                if (p.role === 'GK') {
                    targetX = 760;
                    targetY = Math.max(200, Math.min(300, ball.y));
                } else if (p.team === 'KOR') {
                    if (ball.owner === user) {
                        targetX = 700; 
                        targetY = p.startY;
                    }
                } else if (p.team === 'OPP') {
                    targetX = ball.x;
                    targetY = ball.y;
                }

                let pdx = targetX - p.x;
                let pdy = targetY - p.y;
                let pDist = Math.hypot(pdx, pdy);
                
                if (pDist > 5) {
                    p.x += (pdx / pDist) * p.speed;
                    p.y += (pdy / pDist) * p.speed;
                }
            });

            // 이동 여부 체크 (팔다리 애니메이션 작동을 위해)
            players.forEach(p => {
                p.isMoving = Math.abs(p.x - p.prevX) > 0.5 || Math.abs(p.y - p.prevY) > 0.5;
            });

            // 6. 타이머 업데이트
            frameCount++;
            if (frameCount % 30 === 0) {
                gameTime++;
                let displayTime = gameTime < 10 ? '0' + gameTime : gameTime;
                timeElement.innerText = displayTime + ':00';
                if (gameTime >= 90) {
                    alert(`경기 종료! 최종 스코어 ${score} : 0`);
                    score = 0; gameTime = 0; scoreElement.innerText = score;
                    resetPositions();
                }
            }
        }

        function draw() {
            drawPitch();

            // 공 그리기
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Y축 정렬 (아래에 있는 선수가 위에 그려지도록 입체감 부여)
            players.sort((a, b) => a.y - b.y).forEach(drawPlayer);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initPlayers();
        loop();
    </script>
</body>
</html>
